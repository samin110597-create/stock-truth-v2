<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="description" content="Stock Truth: source-traced stock research, completed-bar structure and conditional swing setups."><title>Stock Truth · Research Terminal</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c1420'/%3E%3Cpath d='M6 23L12 15L18 18L26 7' fill='none' stroke='%23f1b95a' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head>
<body><header><a class="brand" href="./"><span class="brand-icon">ST</span> STOCK TRUTH <small>RESEARCH TERMINAL</small></a><span id="build" class="muted">Loading build…</span></header>
<main><section class="toolbar"><form id="ticker-form"><label for="ticker">ANALYZE ANY TICKER</label><div class="search"><input id="ticker" name="ticker" value="NVDA" maxlength="20" autocomplete="off" spellcheck="false" aria-label="Ticker symbol"><button type="submit">Analyze <span>↗</span></button></div></form><div class="selectors"><label>Mode<select id="mode"><option>Adaptive</option><option>Strict</option></select></label><label>Horizon<select id="horizon"><option value="SWING">Swing · days / weeks</option><option value="POSITION">Position · months</option></select></label><button id="refresh" type="button">Refresh data</button></div></section>
<nav id="watchlist" aria-label="Quick access tickers"></nav><div id="load-status" role="status" aria-live="polite">Connecting to public data sources…</div>
<section id="identity" class="identity"></section><section id="decision" class="panel decision"></section>
<section class="workspace"><div class="panel chart-panel"><div class="section-top"><h2>Price & structure</h2><select id="timeframe" aria-label="Chart timeframe"><option>5M</option><option>15M</option><option>30M</option><option>1H</option><option>4H</option><option selected>1D</option><option>1W</option><option>1M</option></select></div><div class="overlays"><label><input type="checkbox" id="overlay-ema"> EMA 20/50</label><label><input type="checkbox" id="overlay-levels" checked> Levels</label><label><input type="checkbox" id="overlay-structure" checked> Structure</label><label><input type="checkbox" id="overlay-sweeps"> Sweeps</label><label><input type="checkbox" id="overlay-vwap"> VWAP / AVWAP</label><label><input type="checkbox" id="overlay-plan" checked> Entry / stop / targets</label></div><div id="chart" aria-label="Ticker candlestick chart"></div><p id="chart-note" class="muted"></p><p class="attribution">Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noreferrer">TradingView Lightweight Charts™</a> · <a href="../licenses/NOTICE" target="_blank">Attribution notice</a></p></div><aside id="thesis" class="panel thesis"></aside></section>
<section id="mtf" class="panel"></section><section class="grid-two"><div id="reversal" class="panel"></div><div id="validation" class="panel"></div></section><section id="technicals" class="panel"></section><section class="grid-two"><div id="fundamentals" class="panel"></div><div id="health" class="panel"></div></section><section id="ledger" class="panel"></section><section id="ranking" class="panel"></section>
<footer><span>Source facts · Calculations · Model estimates · Price/volume proxies · Unavailable</span><a href="https://github.com/samin110597-create/stock-truth-v2">Source & methodology</a></footer></main><script type="module" src="./app.mjs"></script></body></html>
