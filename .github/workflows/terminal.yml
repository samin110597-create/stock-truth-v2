name: Stock Truth — validate, collect, and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 13-21 * * 1-5'
    - cron: '17 22 * * 1-5'
permissions:
  contents: read
concurrency:
  group: stock-truth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_TOKEN }}
      HF_SPACE_ID: Smit1105/qstate-market-api
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: pip install -r requirements.txt
      - name: Deploy Q-State Hugging Face market API
        id: qstate_api
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HF_TOKEN != ''
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY || secrets.MASSIVE_API_KEY || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY || secrets.POLYGON }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || secrets.FMP_KEY || secrets.FINANCIAL_MODELING_PREP_API_KEY || secrets.FMP }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB_KEY || secrets.FINHUB_API_KEY || secrets.FINNHUB_TOKEN || secrets.FINNHUB }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY || secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHAVANTAGE_API_KEY || secrets.ALPHAVANTAGE_KEY || secrets.ALPHA_VANTAGE }}
          ALLOWED_ORIGIN: https://samin110597-create.github.io
        run: |
          python -m pip install "huggingface_hub>=1.0,<2"
          python -u scripts/deploy_hf_space.py
          echo "QSTATE_API_BASE=https://smit1105-qstate-market-api.hf.space" >> "$GITHUB_ENV"
      - name: Verify Hugging Face API and secured provider route
        if: steps.qstate_api.outcome == 'success'
        env:
          QSTATE_DEPLOYMENT_URL: https://smit1105-qstate-market-api.hf.space
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          base=os.environ['QSTATE_DEPLOYMENT_URL'].rstrip('/')
          def get(path,timeout=45):
              req=urllib.request.Request(base+path,headers={'User-Agent':'StockTruth-CI/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.load(r)
          health=None
          for _ in range(36):
              try:
                  health=get('/health')
                  if health.get('status')=='OK':
                      break
              except Exception:
                  time.sleep(10)
          if not health or health.get('status')!='OK':
              raise SystemExit('Hugging Face Q-State backend did not become healthy')
          configured=health.get('providers') or {}
          if not any(configured.values()):
              raise SystemExit('Hugging Face backend has no secured market-data provider')
          probe=get('/v1/market?'+urllib.parse.urlencode({'symbol':'AAPL','timeframe':'1D'}))
          bars=((probe.get('primary') or {}).get('bars') or [])
          if len(bars)<80:
              raise SystemExit('Arbitrary-ticker probe returned insufficient bars')
          trace=probe.get('provider_trace') or []
          secured=('Massive','FMP','Finnhub','Alpha Vantage')
          if not any(x.get('status')=='OK' and any(s in str(x.get('source','')) for s in secured) for x in trace):
              raise SystemExit('AAPL probe did not successfully use a secured provider')
          print('Hugging Face Q-State API verified:',len(bars),'AAPL daily bars; providers=',configured)
          PY
      - name: Explain snapshot fallback when Hugging Face write token is not configured
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HF_TOKEN == ''
        run: echo "HF_TOKEN is not configured; arbitrary-ticker backend deployment is OFF and Pages will retain snapshot/browser fallback mode."
      - name: Unit integrity gates
        run: |
          npm test
          python -m py_compile scripts/collect_quant.py scripts/collect_quant_context.py scripts/train_quant_model.py scripts/deploy_hf_space.py backend/hf-space/app.py
      - name: Restore optional data supplements
        run: node scripts/snapshot-store.mjs restore
      - name: Generate the exchange calendar
        run: python scripts/generate_calendar.py
      - name: Fetch completed bars and filed facts
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-data]')))
        env:
          MASSIVE_KEY: ${{ secrets.MASSIVE_KEY || secrets.MASSIVE_API_KEY || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY || secrets.POLYGON }}
          POLYGON_KEY: ${{ secrets.POLYGON_API_KEY || secrets.POLYGON_KEY || secrets.MASSIVE_KEY || secrets.MASSIVE_API_KEY || secrets.POLYGON }}
          FMP_KEY: ${{ secrets.FMP_KEY || secrets.FMP_API_KEY || secrets.FINANCIAL_MODELING_PREP_API_KEY || secrets.FMP }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || secrets.FMP_KEY || secrets.FINANCIAL_MODELING_PREP_API_KEY || secrets.FMP }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY || secrets.FINNHUB_API_KEY || secrets.FINHUB_API_KEY || secrets.FINNHUB_TOKEN || secrets.FINNHUB }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB_KEY || secrets.FINHUB_API_KEY || secrets.FINNHUB_TOKEN || secrets.FINNHUB }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY || secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHAVANTAGE_API_KEY || secrets.ALPHAVANTAGE_KEY || secrets.ALPHA_VANTAGE }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY || secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHA_VANTAGE_KEY || secrets.ALPHAVANTAGE_API_KEY || secrets.ALPHA_VANTAGE }}
          FRED_KEY: ${{ secrets.FRED_KEY || secrets.FRED_API_KEY || secrets.FRED }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_KEY || secrets.FRED }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -u scripts/collect.py
          python -u scripts/collect_quant.py
          python -u scripts/collect_quant_context.py
      - name: Reconcile optional daily supplements from independent source
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-data]')))
        run: node scripts/refresh-daily.mjs
      - name: Refresh optional sourced financial statements and ratios
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-data]')))
        run: node scripts/collect-fundamentals.mjs
      - name: Train Q-State 2.0 walk-forward calibrated model
        run: python -u scripts/train_quant_model.py
      - name: Analyze available snapshots and append immutable setup ledger
        if: hashFiles('data/raw/*.json') != ''
        run: npm run analyze
      - name: Save collected snapshots without changing production source
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-data]')))
        run: node scripts/snapshot-store.mjs publish
      - run: npm run build
      - run: npm run check
      - name: Save validation report and reviewable static build
        uses: actions/upload-artifact@v4
        with:
          name: terminal-review-${{ github.sha }}
          path: |
            dist
            data/validation-report.json
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing GitHub Pages site
        uses: actions/configure-pages@v5
      - name: Deploy the exact tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed production commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          url=os.environ['SITE_URL'].rstrip('/')+'/build.json'
          for attempt in range(6):
              try:
                  result=json.load(urllib.request.urlopen(url+'?commit='+os.environ['EXPECTED_SHA'],timeout=15))
                  if result['commit']==os.environ['EXPECTED_SHA']:
                      print('LIVE artifact verified:',result['model_version'],result['commit'])
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Production build metadata did not match deployed commit')
          PY
