name: Bootstrap Stock Truth v2

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v2.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy verified upgraded baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/samin110597-create/stock-truth.git /tmp/stock-truth-source
          cd /tmp/stock-truth-source
          git checkout --quiet 0643dd03243d5aeda4cade1f8016e70841cd6da8
          cd "$GITHUB_WORKSPACE"
          rm -rf docs scripts
          mkdir -p docs scripts .github/workflows api
          cp -R /tmp/stock-truth-source/docs/. docs/
          cp -R /tmp/stock-truth-source/scripts/. scripts/
          cp /tmp/stock-truth-source/requirements-ml.txt ./
          cp /tmp/stock-truth-source/MODEL.md ./
          cp /tmp/stock-truth-source/watchlist.json ./
          cp /tmp/stock-truth-source/.gitignore ./
          cp /tmp/stock-truth-source/.github/workflows/ml-prediction.yml .github/workflows/
          cp /tmp/stock-truth-source/.github/workflows/validate.yml .github/workflows/

      - name: Add secure on-demand market-data endpoint
        shell: bash
        run: |
          cat > api/stock.js <<'JS'
          const UA = 'Mozilla/5.0 StockTruthV2/1.0 research-dashboard';

          function send(res, status, obj) {
            res.statusCode = status;
            res.setHeader('Content-Type', 'application/json; charset=utf-8');
            res.setHeader('Access-Control-Allow-Origin', '*');
            res.setHeader('Cache-Control', status === 200 ? 's-maxage=300, stale-while-revalidate=900' : 'no-store');
            res.end(JSON.stringify(obj));
          }

          function cleanSymbol(raw) {
            const s = String(raw || '').trim().toUpperCase();
            return /^[A-Z0-9.^=-]{1,15}$/.test(s) ? s : null;
          }

          function nyDate(epochSeconds) {
            return new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date(epochSeconds * 1000));
          }

          async function yahooChart(symbol) {
            const u = new URL(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}`);
            u.searchParams.set('range', '10y');
            u.searchParams.set('interval', '1d');
            u.searchParams.set('includeAdjustedClose', 'true');
            u.searchParams.set('events', 'div,splits');
            const r = await fetch(u, { headers: { 'User-Agent': UA, 'Accept': 'application/json' } });
            if (!r.ok) throw new Error(`market data provider returned HTTP ${r.status}`);
            const j = await r.json();
            const result = j?.chart?.result?.[0];
            if (!result) throw new Error(j?.chart?.error?.description || 'ticker was not found');
            return result;
          }

          function makeBars(result) {
            const ts = result.timestamp || [];
            const q = result.indicators?.quote?.[0] || {};
            const adj = result.indicators?.adjclose?.[0]?.adjclose || [];
            const regular = result.meta?.currentTradingPeriod?.regular || {};
            const now = Math.floor(Date.now() / 1000);
            const out = [];
            for (let i = 0; i < ts.length; i++) {
              const rawClose = Number(q.close?.[i]);
              const adjustedClose = Number(adj?.[i]);
              const o = Number(q.open?.[i]), h = Number(q.high?.[i]), l = Number(q.low?.[i]);
              if (![o,h,l,rawClose].every(Number.isFinite) || rawClose <= 0) continue;
              let factor = Number.isFinite(adjustedClose) && adjustedClose > 0 ? adjustedClose / rawClose : 1;
              if (!Number.isFinite(factor) || factor <= 0) factor = 1;
              out.push({
                date: new Date(ts[i] * 1000).toISOString().slice(0,10),
                open: o * factor,
                high: h * factor,
                low: l * factor,
                close: rawClose * factor,
                volume: Number.isFinite(Number(q.volume?.[i])) ? Number(q.volume[i]) : null
              });
            }
            // If today's regular session is still open, remove the forming daily bar.
            if (out.length && regular.start && regular.end && now < Number(regular.end) + 900) {
              const last = out[out.length - 1];
              if (last.date === nyDate(now)) out.pop();
            }
            return out;
          }

          module.exports = async function handler(req, res) {
            if (req.method === 'OPTIONS') return send(res, 200, { ok: true });
            if (req.method !== 'GET') return send(res, 405, { error: 'GET only' });
            const symbol = cleanSymbol(req.query?.symbol);
            if (!symbol) return send(res, 400, { error: 'Enter a valid ticker symbol.' });
            try {
              const result = await yahooChart(symbol);
              const meta = result.meta || {};
              const bars = makeBars(result);
              if (bars.length < 220) return send(res, 422, { error: `Only ${bars.length} usable daily bars were found for ${symbol}.` });
              const last = bars[bars.length - 1];
              const prev = bars[bars.length - 2];
              const current = Number(meta.regularMarketPrice);
              const previousClose = Number(meta.chartPreviousClose ?? meta.previousClose ?? prev?.close);
              const px = Number.isFinite(current) && current > 0 ? current : last.close;
              const ch = Number.isFinite(previousClose) && previousClose > 0 ? px - previousClose : null;
              const generated = new Date().toISOString();
              return send(res, 200, {
                symbol: String(meta.symbol || symbol).toUpperCase(),
                generated_at: generated,
                quote: {
                  source: 'yahoo-chart-server', fetched_at: generated, current: px,
                  change: ch, change_pct: ch != null ? ch / previousClose * 100 : null,
                  high: null, low: null, open: null, prev_close: previousClose, ts: Math.floor(Date.now()/1000)
                },
                profile: {
                  source: 'yahoo-chart-server', fetched_at: generated,
                  name: meta.longName || meta.shortName || meta.symbol || symbol,
                  industry: null, exchange: meta.fullExchangeName || meta.exchangeName || meta.exchange || null,
                  country: null, mcap: null, ipo: null, web: null
                },
                candles: {
                  source: 'yahoo-chart-server', fetched_at: generated,
                  adjustment_type: 'OHLC scaled by Adj Close / raw Close when available',
                  closed_bars_only: true,
                  bars
                },
                daily: { source: 'yahoo-chart-server', fetched_at: generated, bars },
                dynamic_lookup: true,
                data_quality: {
                  history_years_requested: 10,
                  bars_returned: bars.length,
                  adjusted_prices: true,
                  forming_daily_bar_excluded: true
                },
                warnings: [
                  'On-demand mode currently prioritizes price/technical evidence. Some vendor-specific fundamental fields may be unavailable.',
                  'This is research data, not a guarantee of future market direction.'
                ]
              });
            } catch (err) {
              return send(res, 404, { symbol, error: String(err?.message || err) });
            }
          };
          JS

          cat > vercel.json <<'JSON'
          {
            "version": 2,
            "rewrites": [
              { "source": "/data/:path*", "destination": "/docs/data/:path*" },
              { "source": "/", "destination": "/docs/index.html" }
            ],
            "headers": [
              {
                "source": "/api/(.*)",
                "headers": [
                  { "key": "X-Content-Type-Options", "value": "nosniff" },
                  { "key": "Referrer-Policy", "value": "no-referrer" }
                ]
              }
            ]
          }
          JSON

      - name: Enable any-ticker lookup in the dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
            '$("#modeNote").textContent="Only watchlist snapshots generated by GitHub Actions can be opened. To add a symbol, update watchlist.json and run the workflow.";',
            '$("#modeNote").textContent="Watchlist symbols use cached snapshots; any other valid ticker is fetched securely on demand from the server.";'
          )
          s = s.replace('if(!sym||!INDEX)return;', 'if(!sym)return;')
          old = '''  if(!INDEX.tickers.includes(sym)){
    $("#app").innerHTML=`<div class="panel"><h2>${esc(sym)} is not in the secure cache ${tg("NOT FETCHED","bad")}</h2>
      <p class="note">Add <span class="mono">${esc(sym)}</span> to <span class="mono">watchlist.json</span>, run the GitHub Action, and reload. The public page will never ask for an API key or query a vendor directly.</p></div>`;
    return;
  }
  return load(sym);'''
          new = '''  return load(sym);'''
          if old not in s:
            raise SystemExit('ticker restriction block not found')
          s = s.replace(old, new, 1)
          old2 = '''    const snap=await fetchJSON(`./data/${encodeURIComponent(sym)}.json`);
    D=snap;
    D.symbol=D.symbol||sym;
    D.validation=validateSnapshot(D);
    if(D.validation.critical.length)D.load_error="Data-integrity failure: "+D.validation.critical.join("; ");
    try{
      ML=await fetchJSON(`./data/ml/${encodeURIComponent(sym)}.json`);
      if(ML&&ML.symbol&&String(ML.symbol).toUpperCase()!==sym)ML={status:"ERROR",error:"ML snapshot symbol does not match requested ticker"};
    }catch(mlErr){
      ML={status:"UNAVAILABLE",error:"ML snapshot not generated yet",detail:String(mlErr&&mlErr.message||mlErr)};
    }'''
          new2 = '''    let snap=null,fromCache=true;
    try{
      snap=await fetchJSON(`./data/${encodeURIComponent(sym)}.json`);
    }catch(cacheErr){
      fromCache=false;
      snap=await fetchJSON(`/api/stock?symbol=${encodeURIComponent(sym)}`);
    }
    D=snap;
    D.symbol=D.symbol||sym;
    D.validation=validateSnapshot(D);
    if(D.validation.critical.length)D.load_error="Data-integrity failure: "+D.validation.critical.join("; ");
    if(fromCache){
      try{
        ML=await fetchJSON(`./data/ml/${encodeURIComponent(sym)}.json`);
        if(ML&&ML.symbol&&String(ML.symbol).toUpperCase()!==sym)ML={status:"ERROR",error:"ML snapshot symbol does not match requested ticker"};
      }catch(mlErr){
        ML={status:"UNAVAILABLE",error:"ML snapshot not generated yet",detail:String(mlErr&&mlErr.message||mlErr)};
      }
    }else{
      ML={status:"ON_DEMAND",error:"Ticker loaded on demand. Walk-forward ML is not promoted until an out-of-sample model for this symbol clears the edge gate."};
    }'''
          if old2 not in s:
            raise SystemExit('snapshot load block not found')
          s = s.replace(old2, new2, 1)
          s = s.replace('const BUILD_TAG="v4.0 · secure pipeline · walk-forward ML · closed-bar signals · 2026-08-08";',
                        'const BUILD_TAG="v4.1 · any-ticker server lookup · adjusted closed bars · walk-forward validation · 2026-08-08";')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add v2 documentation
        run: |
          cat > README.md <<'MD'
          # Stock Truth v2

          Research dashboard with secure on-demand ticker lookup, cached examples, closed-bar technical analysis, historical thesis backtests, and conservative walk-forward ML validation.

          ## Any ticker
          Enter a valid Yahoo-style ticker such as `AAPL`, `MSFT`, `SHOP.TO`, `BRK-B`, or `^GSPC`. Cached symbols load from bundled JSON. Other symbols are fetched through the server-side `/api/stock` endpoint; no market-data credential is exposed in browser JavaScript.

          ## Data-quality rules
          - Requests 10 years of daily history when available.
          - Uses adjusted OHLC derived from adjusted-close factors when available.
          - Excludes the forming daily bar while the regular session is open.
          - Keeps the current quote separate from closed-bar signal calculations.
          - A model may say **NO VERIFIED EDGE** rather than force a directional call.

          ## Current model baseline
          The original per-symbol ML baseline did not demonstrate a reliable edge across AMZN, GOOG, META, and NVDA. v2 treats that result as a baseline to beat, not as a marketing claim.
          MD

      - name: Validate v2 source
        run: |
          node --check api/stock.js
          python -m py_compile scripts/ml_predict.py scripts/ml_predict_runner.py
          grep -q '/api/stock?symbol=' docs/index.html
          grep -q 'any-ticker server lookup' docs/index.html

      - name: Commit populated v2 repository
        run: |
          git config user.name 'stock-truth-v2-bot'
          git config user.email 'stock-truth-v2-bot@users.noreply.github.com'
          git rm .github/workflows/bootstrap-v2.yml
          git add -A
          git commit -m 'build: populate Stock Truth v2 with secure any-ticker lookup'
          git push origin HEAD:main
